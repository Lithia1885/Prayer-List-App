name: Secret expiry watch

# Opens an issue when one of the Wednesday chain's credentials is running out,
# and closes it again once the date has been moved forward. Two credentials:
#
#   graph — the renderer's Entra client secret (the GitHub render and the
#           heat rock's Graph reads); dated in print/render.config.json
#           → graphSecretExpires
#   token — the heat rock's GitHub token (kicks the render when GitHub's
#           schedule runs late); dated in heatrock/heatrock.config.json
#           → githubTokenExpires
#
# Why (pattern borrowed from the bulletin repo's watchdog): a credential
# expiring is the one failure that silently kills Wednesday on a date nobody
# has written down. When the Graph secret lapses the render fails, the rock
# can't read the archive, and the flow fires its manual-backup alarm — but
# nothing says WHY, and the fix needs lead time nobody has at 1:05 PM on a
# Wednesday. When the token lapses the rock quietly loses its ability to
# kick a late render, and Wednesday is back to depending on GitHub's clock.
# This reads the dates straight out of the config files: no credentials, no
# network, nothing to keep working. It reports by opening an issue because a
# failed workflow run only emails the last committer, while an issue notifies
# everyone watching the repository.
#
# Before a credential is set up at all, it exits quietly instead of nagging
# about a countdown that isn't real yet: for the Graph secret that means "no
# GRAPH_CLIENT_SECRET repo secret"; the rock's token is invisible from here,
# so a null date simply means "not wired up (yet)".

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 13:00 UTC — a working morning in Georgia
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-expiry
  cancel-in-progress: false

env:
  WARN_DAYS: 45

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - secret: graph
            file: print/render.config.json
            key: graphSecretExpires
            title: "The prayer-list renderer's Graph secret needs rotating"
          - secret: token
            file: heatrock/heatrock.config.json
            key: githubTokenExpires
            title: "The heat rock's GitHub token needs rotating"
    env:
      ISSUE_TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the expiry date and work out how long is left
        id: check
        env:
          SECRET: ${{ matrix.secret }}
          FILE: ${{ matrix.file }}
          KEY: ${{ matrix.key }}
          HAVE_GRAPH_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail

          EXPIRES=$(jq -r ".${KEY} // empty" "$FILE")

          if [ -z "$EXPIRES" ]; then
            if [ "$SECRET" = graph ] && [ "$HAVE_GRAPH_SECRET" = true ]; then
              echo "state=unset" >> "$GITHUB_OUTPUT"
              {
                echo "The renderer's credentials are in place (\`GRAPH_CLIENT_SECRET\` is set), but \`graphSecretExpires\` in \`print/render.config.json\` is null — so nothing is counting down to the Entra client secret expiring."
                echo
                echo "When that secret lapses, the Wednesday render fails, the 1:00 flow fires its manual-backup alarm, and the office is back to printing by hand until someone rotates it."
                echo
                echo "**To fix:** open the Entra app registration for the renderer → **Certificates & secrets**, read the **Expires** date off the client secret in use, put it in \`print/render.config.json\` as \`\"graphSecretExpires\": \"YYYY-MM-DD\"\`, and merge. This issue closes itself once the date is set and more than ${WARN_DAYS} days away."
              } > issue-body.md
            else
              echo "No $KEY in $FILE — nothing set up to watch yet."
              echo "state=ok" >> "$GITHUB_OUTPUT"
              echo "days=?" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if ! date -u -d "$EXPIRES" +%s >/dev/null 2>&1; then
            echo "state=unreadable" >> "$GITHUB_OUTPUT"
            echo "\`$KEY\` in \`$FILE\` is \`$EXPIRES\`, which is not a date this workflow can read. It wants plain \`YYYY-MM-DD\`." > issue-body.md
            exit 0
          fi

          LEFT=$(( ( $(date -u -d "$EXPIRES" +%s) - $(date -u +%s) ) / 86400 ))
          echo "$KEY: expires $EXPIRES — $LEFT day(s) left."
          echo "days=$LEFT" >> "$GITHUB_OUTPUT"

          if [ "$LEFT" -gt "${WARN_DAYS}" ]; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$SECRET" in
            graph) WHAT="The renderer's Graph client secret" ;;
            token) WHAT="The heat rock's GitHub token" ;;
          esac

          if [ "$LEFT" -lt 0 ]; then
            echo "state=expired" >> "$GITHUB_OUTPUT"
            HEADLINE="$WHAT expired $(( -LEFT )) day(s) ago, on $EXPIRES."
          else
            echo "state=warn" >> "$GITHUB_OUTPUT"
            HEADLINE="$WHAT expires in $LEFT day(s), on $EXPIRES."
          fi

          {
            echo "$HEADLINE"
            echo
            case "$SECRET" in
              graph)
                echo "When it lapses, the weekly render workflow fails, the heat rock can't read the archive, and the 1:00 PM flow falls back to its manual-backup alarm — the prayer list stops printing itself."
                echo
                echo "**To rotate:**"
                echo
                echo "1. Entra → App registrations → the prayer-list renderer app → **Certificates & secrets** → **New client secret**. Take the longest expiry offered and write the date down before leaving the page — the secret **value** is shown once and never again."
                echo "2. Update the repo secret: Settings → Secrets and variables → Actions → \`GRAPH_CLIENT_SECRET\`."
                echo "3. Update the heat rock's copy: on the office box, re-run the secret step from \`heatrock/README.md\` (rewrites \`C:\\heatrock\\secret.dat\` as the task's account)."
                echo "4. Set \`graphSecretExpires\` in \`print/render.config.json\` to the new expiry date and merge."
                echo "5. Run the **Weekly prayer list render** workflow manually once, and \`Print-PrayerList.ps1\` by hand on the rock, to confirm both — then delete the old secret in Entra."
                echo
                echo "Entra allows two secrets at once, so steps 1–3 can be done without an outage."
                ;;
              token)
                echo "When it lapses, neither the Logic App's 11:45 kick nor the heat rock's 12:30 check can start the render when GitHub's schedule runs late — which has been every week (OPERATIONS.md §0). The Logic App run fails with a 401, the rock logs event 13 instead of 14, and Wednesday is back to depending on GitHub's clock plus someone noticing."
                echo
                echo "**To rotate:**"
                echo
                echo "1. GitHub → Settings → Developer settings → Personal access tokens → **Fine-grained tokens** → Generate new token: this repository only, Repository permissions **Actions: Read and write**, nothing else. Take the longest expiry offered and write the date down — the token is shown once."
                echo "2. Logic App \`prayer-list-render-kick\` → the HTTP action → replace the token in the Authorization header (OPERATIONS.md §8), save, Run once."
                echo "3. On the office box, re-run the token step from \`heatrock/README.md\` (rewrites \`C:\\heatrock\\github-token.dat\` as the task's account), then \`Print-PrayerList.ps1 -TokenCheck\` to prove it."
                echo "4. Set \`githubTokenExpires\` in \`heatrock/heatrock.config.json\` to the new expiry date and merge (and \`git pull\` on the rock)."
                echo "5. Delete the old token on GitHub."
                ;;
            esac
            echo
            echo "This issue closes itself once the date is more than ${WARN_DAYS} days out."
          } > issue-body.md

      - name: Open or update the issue
        if: steps.check.outputs.state != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Exact-title match rather than --search: the search index lags, which
          # would open a second issue on the following week's run.
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open; leaving it alone."
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
          fi

      - name: Close the issue once the date has moved
        if: steps.check.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ steps.check.outputs.days }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Good for $DAYS more day(s). Closing."
          fi
