# Renders the Wednesday prayer list (the page-numbered Typst PDF) and uploads
# it to the SharePoint archive, where the heat rock and the Power Automate
# flow pick it up around 1:00 PM Eastern.
#
# Two ways this starts, layered because GitHub's own scheduler cannot be
# trusted with the timing (OPERATIONS.md §0 has the numbers: 30 and 43
# minutes late, then 3 hours, then 2h21m with two cron entries in the file):
#
#   schedule — every half hour from 09:15 to 16:45 UTC (5:15 AM–12:45 PM
#              EDT, 4:15–11:45 EST). The first try. Re-runs overwrite, so
#              the freshest one to land before printing wins; the early
#              slots exist so that a scheduler running hours late still
#              lands something before 12:30. It fires late, never early.
#   workflow_dispatch — the real clock: the Azure Logic App kick at 11:45
#              AM Eastern (OPERATIONS.md §8), the heat rock's 12:30 check
#              once it is deployed (heatrock/README.md), or a human in the
#              Actions tab. Dispatches are delivered immediately.
#
# Re-runs are safe: the upload PUT overwrites the day's file (named by
# today's date), so any number of same-day runs self-correct the archive
# rather than erroring or duplicating.
#
# If a run fails outright, two nets catch it: GitHub emails the repo owner
# about the failed run, and at 1:00 the flow finds no file for today and
# fires its own "manual backup needed" alarm.

name: Weekly prayer list render

on:
  schedule:
    - cron: '15,45 9-16 * * 3' # Wednesdays, :15 and :45 past each hour, 09-16 UTC
  workflow_dispatch: {}

concurrency:
  group: weekly-prayer-list
  cancel-in-progress: false

env:
  TYPST_VERSION: v0.13.1

jobs:
  render:
    # No credentials guard here, deliberately: the secrets context is not
    # valid in `if:` expressions (a lesson learned as an invalid-workflow
    # error), and now that OPERATIONS.md §5 setup is done, absent credentials
    # are a fault worth a loud failure — render.mjs names the missing env var.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Typst (pinned)
        run: |
          curl -sSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar xf typst.tar.xz
          echo "TYPST_BIN=$PWD/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - name: Render and upload to the archive
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: node print/render.mjs --live --upload
