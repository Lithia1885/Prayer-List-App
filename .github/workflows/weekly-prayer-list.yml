# Renders the Wednesday prayer list (the page-numbered Typst PDF) and uploads
# it to the SharePoint archive, where the Power Automate flow picks it up at
# 1:00 PM Eastern, prints five stapled sets, and emails the office.
#
# Five scheduled attempts, not one: GitHub's cron trigger is documented as
# best-effort and can be delayed under load — and here it has been late
# every week measured: 30 and 43 minutes late, then 3 hours, then (with two
# attempts in this file) one run 2h21m after the later of them, well past
# print time. No failure, no email, nothing to alert on. That trend points
# at the scheduler itself, outside this repo's control, so these are the
# first try only: if nothing has landed by 12:30 Eastern, the heat rock
# dispatches this workflow itself (heatrock/README.md) — the real backstop.
#
# Timing (all comfortably before the 1:00 PM flow, without any DST
# arithmetic here): 14:15/14:45/15:15/15:45/16:15 UTC are
# 10:15/10:45/11:15/11:45/12:15 AM-PM EDT, or 9:15/9:45/10:15/10:45/11:15
# AM EST. 16:15 UTC is the deliberately-unchanged final call — it's the
# slot with the longest track record of actually firing.
#
# Re-runs are safe: the upload PUT overwrites the day's file (named by
# today's date), so any number of same-day runs self-correct the archive
# rather than erroring or duplicating.
#
# If this fails outright (as opposed to silently not triggering), two nets
# catch it: GitHub emails the repo owner about the failed run, and at 1:00
# the flow finds no file for today and fires its own "manual backup needed"
# alarm. See OPERATIONS.md §0 for the whole timeline.

name: Weekly prayer list render

on:
  schedule:
    - cron: '15 14 * * 3' # Wednesdays, attempt 1
    - cron: '45 14 * * 3' # Wednesdays, attempt 2
    - cron: '15 15 * * 3' # Wednesdays, attempt 3
    - cron: '45 15 * * 3' # Wednesdays, attempt 4
    - cron: '15 16 * * 3' # Wednesdays, attempt 5 (final call)
  workflow_dispatch: {}

concurrency:
  group: weekly-prayer-list
  cancel-in-progress: false

env:
  TYPST_VERSION: v0.13.1

jobs:
  render:
    # No credentials guard here, deliberately: the secrets context is not
    # valid in `if:` expressions (a lesson learned as an invalid-workflow
    # error), and now that OPERATIONS.md §5 setup is done, absent credentials
    # are a fault worth a loud failure — render.mjs names the missing env var.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Typst (pinned)
        run: |
          curl -sSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar xf typst.tar.xz
          echo "TYPST_BIN=$PWD/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - name: Render and upload to the archive
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: node print/render.mjs --live --upload
