<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer List · Lithia Springs Methodist</title>
    <meta name="description" content="The prayer team's working list for Lithia Springs Methodist Church." />

    <meta property="og:title" content="Prayer List · Lithia Springs Methodist" />
    <meta property="og:description" content="The prayer team's working list for Lithia Springs Methodist Church." />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#faf9f6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prayer List" />

    <script>
      // Restore the user's saved text-size preference before React mounts —
      // avoids a flash of default-sized text on every load.
      (function () {
        try {
          var s = localStorage.getItem("textSize");
          if (s === "large" || s === "xl") {
            document.documentElement.dataset.textSize = s;
          }
        } catch (e) { /* private mode / storage disabled — fall through */ }
      })();
    </script>

    <script>
      // Last-resort fuse. If the stylesheet fails to load, the app paints
      // unstyled — and an installed copy resumes that wounded page every time
      // it is opened. Reload exactly once per session; the guard is cleared on
      // a successful load so a later genuine failure can still fire.
      (function () {
        var KEY = "stylesheetReloadOnce";
        document.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== "LINK" || t.rel !== "stylesheet") return;
            try {
              if (new URL(t.href, location.href).origin !== location.origin) return;
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (err) {
              return;
            }
            location.reload();
          },
          true // capture: load/error on <link> do not bubble
        );
        window.addEventListener("load", function () {
          try {
            sessionStorage.removeItem(KEY);
          } catch (err) { /* storage disabled — the guard just stays set */ }
        });
      })();
    </script>

    <!-- The church's own typefaces, hosted here (see public/fonts/OFL.txt). The
         two regular weights carry almost every screen, so they're preloaded. -->
    <link rel="preload" href="/fonts/np-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/libre-caslon-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
